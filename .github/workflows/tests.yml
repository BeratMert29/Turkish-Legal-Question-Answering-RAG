name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  test:
    name: pytest (Python 3.11, ubuntu-latest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: CENG493_Project/requirements-test.txt

      - name: Install test dependencies
        run: pip install -r CENG493_Project/requirements-test.txt

      - name: Run pytest
        working-directory: CENG493_Project
        run: python -m pytest tests -v --tb=short
