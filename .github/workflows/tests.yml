name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    name: pytest (Python 3.11, ubuntu-latest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: CENG493_Project/requirements-test.txt

      - name: Install test dependencies
        run: pip install -r CENG493_Project/requirements-test.txt

      - name: Run pytest
        working-directory: CENG493_Project
        run: python -m pytest tests -v --tb=short
