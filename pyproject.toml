# Tool configuration only; the code is run from CENG493_Project/ (see README).

[tool.ruff]
target-version = "py311"
extend-exclude = ["results", "Datasets_Ceng493_legal_rag"]

[tool.ruff.lint]
# Pyflakes (undefined names, unused imports/variables, f-strings without
# placeholders), syntax errors, and the bug-prone bugbear rules.
select = ["F", "E9", "B006", "B008", "B015", "B018", "B023", "B904"]

[tool.ruff.lint.per-file-ignores]
# re-raising inside CLI scripts' except blocks is fine without "from"
"CENG493_Project/scripts/*" = ["B904"]
